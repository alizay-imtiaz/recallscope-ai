<script>
const N=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const sim=(a,b)=>{if(!a||!b||a==b)return 0;if(a.length==b.length){let d=0;for(let i=0;i<a.length;i++)d+=a[i]!=b[i];return d<=1}return a.length>=5&&b.length>=5&&Math.abs(a.length-b.length)<=3&&(a.startsWith(b)||b.startsWith(a))};
function cls(r,rc){const su=N(r.sup)==N(rc.sup),sk=N(r.sku)==N(rc.sku),b=N(r.batch),rb=N(rc.batch),sn=su?'':` Supplier "${r.sup}" differs from the notice supplier.`;
if(!N(r.sku))return b&&b==rb?['possible','Batch matches but the record has no product identifier, so it cannot be confirmed.'+sn]:['missing','No product identifier and no matching batch.'];
if(!sk)return b&&b==rb?['conflict',`Batch ${r.batch} matches but SKU ${r.sku} differs from notice SKU ${rc.sku}. Possible mislabel or different product.`]:['none','SKU and batch both differ from the notice.'];
if(!b)return r.type=='po'?['product','SKU matches; purchase orders carry no batch field, so only product-level exposure can be shown.'+sn]:['missing','SKU matches but the batch/lot field is blank. Cannot be confirmed or excluded.'+sn];
if(b==rb)return su?['exact','Supplier, SKU and batch all agree with the notice (after normalising case and punctuation).']:['conflict',`SKU and batch match but supplier differs ("${r.sup}" vs "${rc.sup}"). Not treated as confirmed.`];
if(sim(b,rb))return['possible',`Batch ${r.batch} is similar or truncated relative to ${rc.batch}. Kept as possible, never promoted to exact.`+sn];
return['none',`Same product, different batch (${r.batch}). Not part of the notified batch within the data searched.`]}
function analyze(recs,rc,scope,ids){const seen={},out=[];recs.filter(r=>(!scope||scope.includes(r.folder))&&(!ids||ids.includes(r.id))).forEach(r=>{const[c,w]=cls(r,rc),o={...r,cat:c,why:w,dup:false},k=[r.type,N(r.ref),N(r.sku),N(r.batch),r.qty].join('|');if(seen[k]){o.dup=true;o.why='Duplicate of '+seen[k]+' (same type, reference, identifiers, quantity); counted once. '+w}else seen[k]=r.file;out.push(o)});
const g=out.filter(o=>o.type=='grn'&&o.cat=='exact'&&!o.dup).map(o=>o.date).sort()[0];out.forEach(o=>{if(o.type=='disp'&&o.cat=='exact'&&g&&o.date<g){o.cat='conflict';o.why=`Dispatch dated ${o.date} is earlier than the earliest exact goods-received date (${g}). Dates conflict.`}});return out}
const CK=['exact','possible','product','conflict','missing','none'],L={exact:'Exact match',possible:'Possible / partial',product:'Product-level',conflict:'Conflicting evidence',missing:'Incomplete / missing',none:'No match in scope'},COL={exact:'#B5C96B',possible:'#F28C52',product:'#16A6A0',conflict:'#B8392F',missing:'#cfcabd',none:'#0E1A22'};
const TY={po:'Purchase order',invoice:'Invoice',grn:'Goods received',inv:'Warehouse stock',disp:'Dispatch'},RV=['Not reviewed','Under review','Verified','Needs clarification','Escalated'];
const SUP='Northvale Foods Ltd',SK='NV-AB-340',BT='L24-0917-B';
const mk=(id,type,folder,file,ref,sup,sku,batch,qty,date,x)=>({id,type,folder,file,ref,sup,sku,batch,qty,date,...x});
const R=[mk('R01','po','Procurement','po_4471.pdf','PO-4471',SUP,SK,'',480,'2026-09-08'),mk('R02','po','Procurement','po_4480.pdf','PO-4480',SUP,'NV-CB-340','',300,'2026-09-09'),mk('R03','invoice','Procurement','inv_88213.pdf','INV-88213',SUP,SK,BT,480,'2026-09-20'),mk('R04','invoice','Procurement','inv_88213_copy.pdf','INV-88213',SUP,SK,BT,480,'2026-09-20'),mk('R05','invoice','Procurement','inv_88302.pdf','INV-88302',SUP,SK,'L24-0917-C',240,'2026-09-27'),
mk('R06','grn','Receiving','grn_9011.pdf','GRN-9011',SUP,SK,BT,480,'2026-09-22',{loc:'Dock 1'}),mk('R07','grn','Receiving','grn_9040.pdf','GRN-9040','Northvale Fresh Foods',SK,BT,120,'2026-09-29',{loc:'Dock 2'}),mk('R08','grn','Receiving','grn_9052.pdf','GRN-9052',SUP,'NV-AB-350',BT,60,'2026-09-30',{loc:'Dock 1'}),mk('R09','grn','Receiving','grn_9060.pdf','GRN-9060',SUP,SK,'',50,'2026-10-01',{loc:'Dock 2'}),
mk('R10','inv','Warehouse','stock_whA.xlsx','STK-A12',SUP,SK,BT,310,'2026-10-20',{loc:'Bay A-12'}),mk('R11','inv','Warehouse','stock_whB.xlsx','STK-B03',SUP,SK,'L24-0917-C',90,'2026-10-20',{loc:'Bay B-03'}),mk('R12','inv','Warehouse','stock_whB2.xlsx','STK-B07',SUP,SK,'L24-0801-A',200,'2026-10-20',{loc:'Bay B-07'}),
mk('R13','disp','Dispatch','disp_3301.csv','DSP-3301',SUP,SK,BT,120,'2026-10-02',{to:'Demo Mart North',po:'SO-7710'}),mk('R14','disp','Dispatch','disp_3301_v2.csv','DSP-3301',SUP,SK,BT,120,'2026-10-02',{to:'Demo Mart North',po:'SO-7710'}),mk('R15','disp','Dispatch','disp_3302.csv','DSP-3302',SUP,SK,BT,80,'2026-10-05',{to:'Sample Grocers East',po:'SO-7722'}),mk('R16','disp','Dispatch','disp_3305.csv','DSP-3305',SUP,SK,'L24-0917-C',40,'2026-10-09',{to:'Test Pantry West',po:'SO-7741'}),mk('R17','disp','Dispatch','disp_3309.csv','DSP-3309',SUP,SK,BT,60,'2026-09-18',{to:'Fictional Foods South',po:'SO-7690'}),mk('R18','disp','Dispatch','disp_3310.csv','DSP-3310',SUP,SK,'',30,'2026-10-12',{to:'Example Market Central',po:'SO-7755'})];
const FOLD=['Notices','Procurement','Receiving','Warehouse','Dispatch'];
const RC0={id:'RS-2026-001',notice:'RN-2026-0042',prod:'Almond Butter 340g',sup:SUP,sku:SK,batch:BT,date:'2026-10-26',notes:'Fictional supplier notice: possible contamination.'};
const SCN=[['exact','Exact batch match','Notice batch '+BT+'; supplier, SKU and batch agree on several records.','exact',{}],
['possible','Partial / truncated batch','Notice batch L24-0917-D is one character from recorded lots; kept as possible.','possible',{rc:{batch:'L24-0917-D'}}],
['product','Product-level match, no batch','Notice lot L24-1105-X is not recorded; only SKU-level links exist.','product',{rc:{batch:'L24-1105-X'}}],
['conflict','Conflicting supplier / SKU / batch','Notice names "Northvale Fresh Foods"; most records name another supplier.','conflict',{rc:{sup:'Northvale Fresh Foods'}}],
['missing','Incomplete records','Only goods-received and dispatch rows with blank batch fields.','missing',{ids:['R09','R18']}],
['none','No match in searched scope','Notice lot ZZ9-0000 / XX-111 appears nowhere in selected folders.','none',{rc:{sku:'XX-111',batch:'ZZ9-0000'},scope:['Warehouse']}],
['dup','Edge: duplicate records','Same invoice and dispatch stored twice; counted once.','exact',{ids:['R03','R04','R13','R14'],dup:1}],
['diff','Edge: different batches, same product','Three lots of one SKU; only the notified lot matches.','none',{ids:['R10','R11','R12'],rc:{batch:'L24-0555-Q'}}],
['dates','Edge: conflicting dates','A dispatch predates the earliest receipt of the same batch.','conflict',{ids:['R06','R17']}]];
const HIST=[{t:'Chocolate spread 400g – label error',s:'Closed (synthetic)',d:'2026-08-14'},{t:'Oat drink 1L – packaging fault',s:'In review (synthetic)',d:'2026-09-30'}];
const S={rc:{...RC0},scope:[...FOLD],ids:null,sc:null,rv:{},sel:null,res:[],q:'',f:'',sup:'',ty:'',st:'',log:[]};
const run=()=>{S.res=analyze(R,S.rc,S.scope,S.ids)};run();
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cnt=()=>{const c=Object.fromEntries(CK.map(k=>[k,0]));c.dup=0;S.res.forEach(o=>o.dup?c.dup++:c[o.cat]++);return c};
const rs=o=>(S.rv[o.id]||{}).st||'Not reviewed',cp=k=>`<span class="chip ${k}">${L[k]}</span>`;
const tbl=(h,rows)=>`<div class="w"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr ${r.a||''}>${r.c.map((x,i)=>`<td data-l="${h[i]}">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const hd=(t,d)=>`<h1>${t}</h1><p class="sub">${d}</p>`,toast=m=>{const t=$('#t');t.textContent=m;t.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>t.hidden=true,3500)};
const row=(o,ex)=>({a:`data-sel="${o.id}" tabindex="0"`,c:[E(o.ref),E(o.file),E(o.batch||'(blank)'),o.qty,E(o.date),...ex(o),cp(o.cat)+(o.dup?' <span class="h">duplicate</span>':'')+'<br><span class="h">'+rs(o)+'</span>']});
const filt=(types,sel)=>{const q=S.q.toLowerCase();return S.res.filter(o=>types.includes(o.type)&&(!S.f||o.cat==S.f)&&(!S.sup||o.sup==S.sup)&&(!S.ty||o.type==S.ty)&&(!S.st||rs(o)==S.st)&&(!q||(o.file+o.ref+o.batch+o.sku+o.sup+(o.to||'')).toLowerCase().includes(q)))};
const bar=(types,sel)=>{const sp=[...new Set(R.map(r=>r.sup))];return `<div class="tb noprint"><input id="q" type="search" placeholder="Search file, reference, batch, SKU" aria-label="Search" value="${E(S.q)}"><select id="f" aria-label="Category"><option value="">All categories</option>${CK.map(k=>`<option value="${k}" ${S.f==k?'selected':''}>${L[k]}</option>`).join('')}</select><select id="sup" aria-label="Supplier"><option value="">All suppliers</option>${sp.map(s=>`<option ${S.sup==s?'selected':''}>${E(s)}</option>`).join('')}</select>${sel?`<select id="ty" aria-label="Document type"><option value="">All document types</option>${Object.keys(TY).map(k=>`<option value="${k}" ${S.ty==k?'selected':''}>${TY[k]}</option>`).join('')}</select><select id="st" aria-label="Review status"><option value="">All review statuses</option>${RV.map(s=>`<option ${S.st==s?'selected':''}>${s}</option>`).join('')}</select>`:''}<button class="btn o" data-a="clr">Clear</button></div>`};
const empty='<p class="sub"><strong>No records match.</strong> Clear the filters, or check the selected folders in New Investigation.</p>';
const NOP='A missing match is not proof that a product is unaffected.';
function rep(){const c=cnt(),u=S.res.filter(o=>!o.dup),pick=t=>u.filter(o=>t.includes(o.type));return{generated:new Date().toISOString(),dataNote:'Fictional synthetic data; not from a live NAS.',investigation:S.rc,scenario:S.sc,foldersSearched:S.ids?'Scenario record subset':S.scope,counts:c,records:S.res.map(o=>({...o,review:rs(o),reviewerNote:(S.rv[o.id]||{}).n||''})),disclaimer:'Human review required. This report does not make a product-safety decision. '+NOP}}
const V={
dash(){const c=cnt(),rv=Object.fromEntries(RV.map(s=>[s,0]));S.res.forEach(o=>rv[rs(o)]++);return hd('Executive dashboard',`Current investigation <b>${E(S.rc.id)}</b>: ${E(S.rc.prod)}, batch ${E(S.rc.batch)}. All figures are calculated from the synthetic records in scope.`)+
`<div class="grid"><div class="k"><b>${S.res.length}</b><span>Records reviewed (${c.dup} duplicate)</span></div>${CK.map(k=>`<div class="k ${k}"><b>${c[k]}</b><span>${L[k]}</span></div>`).join('')}</div>
<div class="two"><div class="card"><h2>Category distribution</h2><div class="bars">${CK.map(k=>`<div><span>${L[k]}</span><i style="width:${Math.max(2,c[k]/Math.max(1,...CK.map(x=>c[x]))*60)}%;background:${COL[k]}"></i><b>${c[k]}</b></div>`).join('')}</div><p class="h">${NOP}</p></div>
<div class="card"><h2>Evidence review status</h2>${tbl(['Status','Records'],RV.map(s=>({c:[s,rv[s]]})))}<p class="h">Statuses are set in <a href="#evid">Evidence explorer</a>.</p></div></div>

new(){const r=S.rc,x=(i,l,h,t)=>`<label for="${i}">${l} <span class="h">${h||''}</span></label>${i=='notes'?`<textarea id="notes" rows="3">${E(r.notes)}</textarea>`:`<input id="${i}" type="${t||'text'}" value="${E(r[i])}" aria-describedby="e_${i}">`}<div class="err" id="e_${i}"></div>`;

<p style="margin-top:14px"><button class="btn" data-a="run">Run investigation</button> <button class="btn o" data-a="reset">Reset to demo investigation</button></p><p class="h">Edit any field and run again; every module updates from the same state.</p></div>`},
proc(){const o=filt(['po','invoice']);return hd('Supplier & procurement','Purchase orders and invoices linked to the notice. Purchase orders list SKUs only, so they can reach product-level at most.')+bar()+`<div class="card">${o.length?tbl(['Ref','Source','Batch','Qty','Date','Supplier','Type','Match status'],o.map(r=>row(r,x=>[E(x.sup),TY[x.type]]))):empty}</div>`},
recv(){const u=S.res.filter(o=>!o.dup),q=(t,k)=>u.filter(o=>o.type==t&&o.cat==k).reduce((s,o)=>s+o.qty,0),a=q('grn','exact'),d=q('disp','exact'),h=q('inv','exact'),o=filt(['grn','inv']);
return hd('Receiving & warehouse','Goods receipts and stock records. "Recorded" values come from the record; calculated values below are inferred and indicative only.')+bar()+`<div class="grid"><div class="k"><b>${a}</b><span>Recorded: received (exact)</span></div><div class="k"><b>${d}</b><span>Recorded: dispatched (exact)</span></div><div class="k"><b>${h}</b><span>Recorded: on hand (exact)</span></div><div class="k"><b>${h-(a-d)}</b><span>Inferred: on hand − (received − dispatched)</span></div></div><div class="card">${o.length?tbl(['Ref','Source','Batch','Qty','Date','Location','Type','Match status'],o.map(r=>row(r,x=>[E(x.loc||'—'),TY[x.type]+(x.batch?'':' <span class="h">· batch missing</span>')]))):empty}<p class="h">Non-zero differences may indicate a discrepancy, or simply records outside scope. The calculation ignores possible, conflicting and incomplete rows.</p></div>`},
disp(){const o=filt(['disp']);return hd('Dispatch & downstream','Shipments of the product to fictional customers. This tool never notifies customers; any outreach is a human decision made outside it.')+bar()+`<div class="card">${o.length?tbl(['Ref','Source','Batch','Qty','Date','Customer (fictional)','Order','Match status'],o.map(r=>row(r,x=>[E(x.to),E(x.po)+(x.batch?'':' <span class="h">· no batch</span>')]))):empty}<p class="h">Flagged: blank batch fields and dispatches dated before receipt. Related purchase and stock evidence is in <a href="#proc">Procurement</a> and <a href="#recv">Receiving</a>.</p></div>`},
evid(){const o=filt(Object.keys(TY)),s=S.res.find(r=>r.id==S.sel),n=s?S.rv[s.id]||{}:{};
const d=s?`<div class="card"><h2>${E(s.ref)} <span class="h">${E(s.id)}</span></h2><p>${cp(s.cat)}</p><dl><dt><b>Source</b></dt><dd>Simulated: /${s.folder}/${E(s.file)}</dd><dt><b>Recorded</b></dt><dd>${E(s.sup)} · SKU ${E(s.sku||'(blank)')} · batch ${E(s.batch||'(blank)')} · qty ${s.qty} · ${E(s.date)}</dd><dt><b>Recall identifiers</b></dt><dd>${E(S.rc.sup)} · ${E(S.rc.sku)} · ${E(S.rc.batch)}</dd><dt><b>Why</b></dt><dd>${E(s.why)}</dd><dt><b>Missing</b></dt><dd>${[!s.sku&&'SKU',!s.batch&&'batch/lot'].filter(Boolean).join(', ')||'None'}</dd></dl><label for="rvs">Reviewer status</label><select id="rvs">${RV.map(v=>`<option ${rs(s)==v?'selected':''}>${v}</option>`).join('')}</select><label for="rvn">Reviewer note</label><textarea id="rvn" rows="2">${E(n.n||'')}</textarea><p><button class="btn" data-a="rv">Save review</button></p></div>`:'<div class="card"><p class="sub">Select a record to see its explanation and set a review status.</p></div>';
return hd('Evidence explorer','Every record with source reference, original values, category and review status.')+bar(1)+`<div class="two ev"><div class="card">${o.length?tbl(['Ref','Source','Batch','Qty','Date','Type','Category / review'],o.map(r=>({a:`data-sel="${r.id}" tabindex="0" class="${S.sel==r.id?'sel':''}"`,c:[E(r.ref),E(r.file),E(r.batch||'(blank)'),r.qty,E(r.date),TY[r.type],cp(r.cat)+'<br><span class="h">'+rs(r)+'</span>']}))):empty}</div><div>${d}</div></div>`},
imp(){const c=cnt(),W={exact:'Supplier, SKU and batch all agree after normalising case and punctuation.',possible:'Batch is one character off or truncated, or a batch matches with no SKU. Never promoted to exact.',product:'SKU matches but the record type has no batch field (e.g. purchase order).',conflict:'Supplier, SKU or batch disagree, or dates contradict each other.',missing:'SKU matches but a batch field that should exist is blank.',none:'Nothing matched in the searched scope. '+NOP};
return hd('Impact analysis','Six separate categories; none are merged. Each record shows why it was classified.')+`<div class="grid">${CK.map(k=>`<div class="k ${k}"><b>${c[k]}</b><span>${L[k]}</span></div>`).join('')}</div><div class="card"><h2>Classification rules</h2>${tbl(['Category','Rule'],CK.map(k=>({c:[cp(k),W[k]]})))}</div><div class="card"><h2>Per-record reasoning</h2>${S.res.length?tbl(['Ref','Type','Batch','Category','Why'],S.res.map(r=>({a:`data-sel="${r.id}" data-go="evid" tabindex="0"`,c:[E(r.ref),TY[r.type],E(r.batch||'(blank)'),cp(r.cat),E(r.why)]}))):empty}<p class="h">Select a row to open it in the Evidence explorer.</p></div>`},
rep(){const r=rep(),c=r.counts,ev=t=>S.res.filter(o=>t.includes(o.type)).map(o=>`<li>${E(o.ref)} (${E(o.file)}) · batch ${E(o.batch||'blank')} · qty ${o.qty} · ${L[o.cat]}${o.dup?' · duplicate':''}</li>`).join('')||'<li>None in scope</li>';
const gaps=S.res.filter(o=>['conflict','missing'].includes(o.cat)&&!o.dup).map(o=>`<li>${E(o.ref)}: ${E(o.why)}</li>`).join('')||'<li>None found within scope (this is not proof of absence)</li>',rn=S.res.filter(o=>S.rv[o.id]).map(o=>`<li>${E(o.ref)}: ${rs(o)}${S.rv[o.id].n?' — '+E(S.rv[o.id].n):''}</li>`).join('')||'<li>No review actions recorded</li>';
return hd('Impact report','Built from the current results. Exports contain exactly this data.')+`<p class="noprint"><button class="btn" data-a="print">Print / save as PDF</button> <button class="btn o" data-a="csv">CSV</button> <button class="btn o" data-a="json">JSON</button> <span class="h">PNG export is not implemented.</span></p><div class="paper"><h2>Impact report · ${E(S.rc.id)}</h2><p class="h">Fictional synthetic data. Not generated from a live NAS.${S.sc?' Scenario: '+E(S.sc)+'.':''}</p><dl><dt>Recall notice</dt><dd>${E(S.rc.notice)} · ${E(S.rc.date)}</dd><dt>Product</dt><dd>${E(S.rc.prod)} · SKU ${E(S.rc.sku)}</dd><dt>Supplier</dt><dd>${E(S.rc.sup)}</dd><dt>Batch / lot</dt><dd>${E(S.rc.batch)}</dd><dt>Notes</dt><dd>${E(S.rc.notes||'—')}</dd><dt>Scope</dt><dd>${S.ids?'Scenario record subset':S.scope.map(f=>'/'+f).join(', ')}</dd><dt>Records reviewed</dt><dd>${S.res.length} (${c.dup} duplicates)</dd></dl>
<h3>Classification summary</h3><p>${CK.map(k=>cp(k)+' '+c[k]).join(' &nbsp; ')}</p><h3>Purchase evidence</h3><ul>${ev(['po','invoice'])}</ul><h3>Receiving and warehouse evidence</h3><ul>${ev(['grn','inv'])}</ul><h3>Dispatch evidence</h3><ul>${ev(['disp'])}</ul><h3>Conflicts and missing information</h3><ul>${gaps}</ul><h3>Reviewer notes and status</h3><ul>${rn}</ul>
<h3>Recommended verification steps</h3><ul><li>Open each source file and confirm batch, SKU and supplier on the original document.</li><li>Resolve conflicts from physical labels or supplier invoices.</li><li>Ask the supplier to confirm truncated or missing batch numbers.</li><li>Widen the searched scope before concluding anything about absence.</li></ul><div class="hr"><b>Human review required.</b> ${r.disclaimer} No inventory is changed and no customer is notified by this tool.</div></div>`},
test(){const c=S.sc?SCN.find(s=>s[1]==S.sc):null,cc=cnt();return hd('Test scenarios','Nine synthetic scenarios: the six categories plus three edge cases. Select one and run it to update every module.')+`<div class="ban">Synthetic demonstrations only. These are not real-world validation or NAS test results.</div><fieldset class="sc"><legend class="h">Choose a scenario</legend>${SCN.map((s,i)=>`<label><input type="radio" name="sn" value="${s[0]}" ${(c?c[0]==s[0]:!i)?'checked':''}><b>${s[1]}</b><span class="h">${s[2]}</span></label>`).join('')}</fieldset><p><button class="btn" data-a="scn">Run scenario</button> <button class="btn o" data-a="reset">Reset</button></p>`+(c?`<div class="card"><h2>${E(c[1])}</h2><p>Expected: ${cp(c[3])} present. Result: <b>${cc[c[3]]>0?'expectation met':'expectation NOT met'}</b> (${CK.map(k=>L[k]+' '+cc[k]).join(', ')}).</p><p><a class="btn o" href="#evid">Inspect evidence</a> <a class="btn o" href="#rep">View report</a></p></div>`:'')},
arch(){const T=[['Website and interactive demo (this page)','Built','bd'],['Classification, search, review, export logic','Built (browser, synthetic data)','bd'],['Folder selection','Simulated','bi'],['Document extraction / AI','Not implemented; simulated by pre-structured data','bi'],['UGREEN AI NAS integration','Planned, not verified','bp'],['Real-record and NAS validation','Pending','bp']];return hd('Architecture & status','Static HTML/CSS/JS. No servers, APIs or keys. No UGREEN endorsement is claimed.')+`<div class="card">${tbl(['Component','Status'],T.map(t=>({c:[t[0],`<span class="chip ${t[2]}">${t[1]}</span>`]})))}</div><div class="card"><h2>Quality assurance</h2><p>Test results, untested items and known limitations are on the main site: <a href="index.html#testing">Quality Assurance &amp; Validation</a>.</p></div><div class="card"><h2>Intended flow (design intention)</h2><p>Authorized NAS records → extraction → identifier comparison → six-category classification → evidence-linked report → human review.</p></div>`}};
const NAV=[['dash','Executive dashboard'],['new','New investigation'],['proc','Supplier & procurement'],['recv','Receiving & warehouse'],['disp','Dispatch & downstream'],['evid','Evidence explorer'],['imp','Impact analysis'],['rep','Impact report'],['test','Test scenarios'],['arch','Architecture & status']];
let cur='';function go(){const h=location.hash.slice(1),v=V[h]?h:'dash';if(v!=cur){S.q=S.f=S.sup=S.ty=S.st='';cur=v}$('#m').innerHTML=`<div class="ban"><b>Interactive concept demo — fictional data.</b> Not connected to a live UGREEN NAS; no real AI analysis.</div>`+V[v]();$('#nav').innerHTML=NAV.map(([k,t])=>`<a href="#${k}" ${k==v?'class="on" aria-current="page"':''}>${t}</a>`).join('');$('#side').classList.remove('open');$('#mb').setAttribute('aria-expanded','false');document.title=NAV.find(n=>n[0]==v)[1]+' · RecallScope AI demo'}
const rerender=()=>{const a=document.activeElement.id,p=document.activeElement.selectionStart;go();if(a&&$('#'+a)){$('#'+a).focus();try{$('#'+a).setSelectionRange(p,p)}catch(e){}}};
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function validate(){const v=k=>$('#'+k).value.trim(),e={};if(!/^[A-Za-z0-9-]{3,}$/.test(v('id')))e.id='Use at least 3 letters, digits or hyphens.';['notice','prod','sup'].forEach(k=>{if(!v(k))e[k]='This field is required.'});if(!/^[A-Za-z0-9-]{3,}$/.test(v('sku')))e.sku='Enter a SKU of letters, digits and hyphens (3+).';if(N(v('batch')).length<3)e.batch='Enter a batch/lot number of at least 3 letters or digits.';if(!v('date')||isNaN(Date.parse(v('date'))))e.date='Choose a valid date.';if(!document.querySelector('[name=fs]:checked'))e.fs='Select at least one folder to search.';
['id','notice','prod','sup','sku','batch','date','fs'].forEach(k=>$('#e_'+k).textContent=e[k]||'');return Object.keys(e).length?e:null}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]'),r=e.target.closest('[data-sel]'),a=b&&b.dataset.a;
if(a=='run'){const er=validate();if(er){toast('Please fix the highlighted fields.');const f=$('#e_'+Object.keys(er)[0]);if(f&&f.previousElementSibling.focus)f.previousElementSibling.focus();return}S.log.unshift({t:S.rc.id+' · '+S.rc.prod,d:S.rc.date});const v=k=>$('#'+k).value.trim();S.rc={id:v('id'),notice:v('notice'),prod:v('prod'),sup:v('sup'),sku:v('sku'),batch:v('batch'),date:v('date'),notes:v('notes')};S.scope=[...document.querySelectorAll('[name=fs]:checked')].map(x=>x.value);S.ids=null;S.sc=null;S.rv={};S.sel=null;run();toast('Investigation run: '+S.res.length+' records classified.');location.hash='imp'}
else if(a=='reset'){S.rc={...RC0};S.scope=[...FOLD];S.ids=null;S.sc=null;S.rv={};S.sel=null;run();toast('Reset to the demo investigation.');go()}
else if(a=='scn'){const k=document.querySelector('[name=sn]:checked').value,s=SCN.find(x=>x[0]==k);S.rc={...RC0,...(s[4].rc||{})};S.scope=s[4].scope||[...FOLD];S.ids=s[4].ids||null;S.sc=s[1];S.rv={};S.sel=null;run();toast('Scenario run: '+s[1]);go()}
else if(a=='clr'){S.q=S.f=S.sup=S.ty=S.st='';go()}
else if(a=='rv'){S.rv[S.sel]={st:$('#rvs').value,n:$('#rvn').value.trim()};toast('Review status saved.');go()}
else if(a=='print')window.print();
else if(a=='json')dl('recallscope-report.json',JSON.stringify(rep(),null,2),'application/json');
else if(a=='csv'){const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"',H=['id','type','folder','file','ref','supplier','sku','batch','qty','date','category','duplicate','why','review','note'];dl('recallscope-report.csv',[H.join(','),...rep().records.map(o=>[o.id,o.type,o.folder,o.file,o.ref,o.sup,o.sku,o.batch,o.qty,o.date,L[o.cat],o.dup,o.why,o.review,o.reviewerNote].map(q).join(','))].join('\n'),'text/csv')}
else if(r){S.sel=r.dataset.sel;if(r.dataset.go)location.hash=r.dataset.go;else go()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.matches('tr[data-sel]'))e.target.click()});
document.addEventListener('input',e=>{if(e.target.id=='q'){S.q=e.target.value;rerender()}});
document.addEventListener('change',e=>{const m={f:'f',sup:'sup',ty:'ty',st:'st'}[e.target.id];if(m){S[m]=e.target.value;rerender()}});
$('#mb').onclick=()=>{const o=$('#side').classList.toggle('open');$('#mb').setAttribute('aria-expanded',o)};
addEventListener('hashchange',()=>{go();scrollTo(0,0)});go();
</script></body></html>
